<body>
<div class="top"><img src="icon-192.png" alt=""><b id="topTitle">Contrôle qualité</b><button id="who" class="hidden"></button></div>

  <a href="#/" data-nav="home"><span>🏠</span>Accueil</a>
  <a href="#/objet" data-nav="objet"><span>🔎</span>Objet trouvé</a>
  <a href="#/historique" data-nav="historique"><span>🗂️</span>Mes contrôles</a>
  <a href="#/reglages" data-nav="reglages"><span>⚙️</span>Réglages</a>

<div id="toast" aria-live="polite"></div>
<script src="donnees.js"></script>
<script>
"use strict";
/* Contrôle qualité studios & communs — app GSM (PWA). Données de travail dans le téléphone (IndexedDB),
   envoi au relais Google Apps Script (Sheet + Drive), lu ensuite par l'exe du PC. */
const VERSION = "1.0.1";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 1) => (n === null || n === undefined || Number.isNaN(Number(n)) ? "–" : Number(n).toLocaleString("fr-BE", { maximumFractionDigits: d }));
const fdate = (iso) => (iso ? `${String(iso).slice(8, 10)}/${String(iso).slice(5, 7)}/${String(iso).slice(0, 4)}` : "–");
const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => isoLocal(new Date());
const nowTime = () => new Date().toTimeString().slice(0, 5);
const hex = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, "0")).join("");
const stamp = () => { const d = new Date(); return `${isoLocal(d).replace(/-/g, "")}-${d.toTimeString().slice(0, 8).replace(/:/g, "")}`; };
const RATING_VALUE = { ok: 1, partiel: 0.5, nc: 0 };
const RATING_LABEL = { ok: "Conforme", partiel: "À reprendre", nc: "Non conforme", na: "N/A" };
const RESULT_CLASS = { "Validé": "good", "Réserves": "warn", "Refusé": "bad" };
const resultPill = (r) => (r ? `<span class="pill ${RESULT_CLASS[r] || "grey"}">${esc(r)}</span>` : "");

function toast(msg, bad = false) {
  const n = document.createElement("div"); n.textContent = msg; if (bad) n.className = "bad";
  $("#toast").appendChild(n); setTimeout(() => n.remove(), bad ? 6000 : 3000);
}
document.addEventListener("click", (e) => {
  const img = e.target.closest("img[data-zoom]");
  if (!img) return;
  const box = document.createElement("div"); box.className = "lightbox"; box.innerHTML = `<img src="${img.src}" alt="">`;
  box.onclick = () => box.remove(); document.body.appendChild(box);
});

/* ---------------- stockage local (IndexedDB) ---------------- */
const Store = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const req = indexedDB.open("aabd-controle-qualite", 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const [name, key] of [["kv", "k"], ["drafts", "k"], ["outbox", "id"], ["history", "id"]]) if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: key });
      };
      req.onsuccess = () => { this.db = req.result; res(this.db); };
      req.onerror = () => rej(req.error);
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store); let out;
      const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("Stockage plein ?"));
    });
  },
  get(store, key) { return this.tx(store, "readonly", (s) => s.get(key)); },
  put(store, val) { return this.tx(store, "readwrite", (s) => s.put(val)); },
  del(store, key) { return this.tx(store, "readwrite", (s) => s.delete(key)); },
  all(store) { return this.tx(store, "readonly", (s) => s.getAll()); },
};
async function kv(key, fallback) { const r = await Store.get("kv", key); return r ? r.v : fallback; }
async function setKv(key, v) { await Store.put("kv", { k: key, v }); }
const defaultSettings = () => ({ url: "", token: "", controllers: [], controller: "", persisted: null });
async function settings() { return { ...defaultSettings(), ...(await kv("settings", {})) }; }
async function saveSettings(s) { await setKv("settings", s); }

/* ---------------- configuration (grilles, studios, VIP) ---------------- */
let CONF = { ...DATA, vip: { date: "", list: [] }, cleaners: [] };
async function loadConf() {
  const remote = await kv("config", null);
  if (remote && remote.grids) CONF = { ...CONF, ...remote, studios: remote.studios || DATA.studios };
}
const areas = () => CONF.grids.commonAreas;
function gridFor(kind, loc) {
  const g = CONF.grids;
  if (kind === "studio") return g.studio;
  const area = areas().find((a) => a.id === loc);
  if (!area) return null;
  const extras = (g.commonExtras || {})[area.type] || [];
  return [{ zone: "Général", items: g.commonBase }].concat(extras.length ? [{ zone: "Spécifique", items: extras }] : []);
}
function scoreColor(score) {
  if (score === null || score === undefined) return "inherit";
  const t = CONF.grids.thresholds;
  return score >= t.valid ? "var(--good)" : score >= t.refuse ? "var(--warn)" : "var(--bad)";
}
function computeScore(zones, items) {
  let num = 0, den = 0, rated = 0, total = 0; const critical = [], zoneScores = {};
  for (const zone of zones) {
    let zn = 0, zd = 0;
    for (const it of zone.items) {
      total++;
      const rating = items[`${zone.zone}|${it.id}`]?.rating;
      if (rating) rated++;
      if (it.tech || !(rating in RATING_VALUE)) continue;
      zn += it.weight * RATING_VALUE[rating]; zd += it.weight;
      if (rating === "nc" && it.critical) critical.push(it.label);
    }
    zoneScores[zone.zone] = zd ? Math.round((1000 * zn) / zd) / 10 : null; num += zn; den += zd;
  }
  const t = CONF.grids.thresholds;
  const score = den ? Math.round((1000 * num) / den) / 10 : null;
  const result = score === null ? "" : critical.length || score < t.refuse ? "Refusé" : score < t.valid ? "Réserves" : "Validé";
  return { score, result, critical, zoneScores, rated, total };
}

/* ---------------- relais Google ---------------- */
/** Lit le code « AABD-CQ|url|jeton » même abîmé par un copier-coller sur GSM
    (retours à la ligne, espaces, caractères invisibles, texte autour, barre verticale pleine chasse). */
function parseConfigCode(raw) {
  const pattern = /AABD-CQ\|(https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec)\|([A-Za-z0-9_-]{16,})/;
  const base = String(raw || "").replace(/[​-‍⁠﻿`"'<>]/g, "").replace(/[｜¦∣]/g, "|");
  // 1re passe : on garde les retours à la ligne (le texte du mail après le code ne se colle pas au jeton) ;
  // 2e passe : tout recollé (Gmail coupe parfois la longue adresse en plein milieu).
  for (const s of [base.replace(/[ \t ]+/g, ""), base.replace(/\s+/g, "")]) {
    const m = s.match(pattern);
    if (m) return { url: m[1], token: m[2] };
  }
  const s = base.replace(/\s+/g, "");
  if (!s) return { error: "Collez le code reçu par mail." };
  if (!/AABD-CQ/.test(s)) return { error: "Code incomplet : il doit commencer par AABD-CQ| (copiez toute la ligne du mail)." };
  if (!/\/exec\|/.test(s)) return { error: "Code incomplet : l'adresse du relais (…/exec) est coupée. Copiez toute la ligne." };
  return { error: "Code incomplet : le jeton (après le dernier |) manque. Copiez toute la ligne." };
}
async function relayGet(params) {
  const s = await settings();
  if (!s.url) throw new Error("Relais non configuré (Réglages).");
  const q = new URLSearchParams({ ...params, token: s.token });
  let r;
  try { r = await fetch(`${s.url}?${q}`, { cache: "no-store" }); } catch { throw new Error("Pas de réseau ou relais injoignable."); }
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || "Erreur du relais");
  return data;
}
async function relayPost(body) {
  const s = await settings();
  if (!s.url) throw new Error("Relais non configuré (Réglages).");
  let r;
  try { r = await fetch(s.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, token: s.token }) }); }
  catch { throw new Error("Pas de réseau ou relais injoignable : nouvel essai automatique."); }
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || "Erreur du relais");
  return data;
}
async function refreshState(silent = true) {
  try {
    const data = await relayGet({ action: "state" });
    await setKv("state", { last: data.last || {}, at: new Date().toISOString() });
    if (data.config && data.config.grids) { await setKv("config", data.config); await loadConf(); }
    return true;
  } catch (e) { if (!silent) toast(e.message, true); return false; }
}

/* ---------------- file d'envoi ---------------- */
let flushing = false, sent = 0;
async function flush() {
  if (flushing || !navigator.onLine) return;
  const s = await settings();
  if (!s.url) return;
  flushing = true;
  try {
    const items = (await Store.all("outbox")).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    sent = 0;
    for (const ev of items) {
      try {
        await relayPost({ kind: ev.kind, record: ev.record, photos: ev.photos });
        await Store.del("outbox", ev.id);
        sent++;
        const h = await Store.get("history", ev.id);
        if (h) { h.sent = true; h.sentAt = new Date().toISOString(); await Store.put("history", h); }
      } catch (e) {
        ev.tries = (ev.tries || 0) + 1; ev.lastError = e.message; await Store.put("outbox", ev);
        break;
      }
    }
  } finally { flushing = false; }
  updateBanner();
  if (sent && /^#\/(rapport|historique)/.test(location.hash)) route();
}
async function enqueue(kind, record, photos, summary) {
  await Store.put("outbox", { id: record.id, kind, record, photos, createdAt: new Date().toISOString() });
  await Store.put("history", { ...summary, id: record.id, type: kind, sent: false });
  flush();
}
async function updateBanner() {
  const box = $("#outboxBanner");
  if (!box) return;
  const ob = await Store.all("outbox");
  if (!ob.length) { box.innerHTML = ""; return; }
  const last = ob.find((x) => x.lastError);
  box.innerHTML = `<div class="banner ${last ? "bad" : "warn"}"><span><b>${ob.length} envoi(s) en attente</b>${!navigator.onLine ? "<br>Hors ligne : envoi automatique au retour du réseau." : last ? `<br><span class="small">${esc(last.lastError)}</span>` : ""}</span><button class="btn small" id="retry">Renvoyer</button></div>`;
  $("#retry").onclick = () => flush();
}
window.addEventListener("online", flush);

/* ---------------- photos ---------------- */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image illisible.")); };
    img.src = url;
  });
}
const photoName = () => `P${stamp()}-${hex(3)}.jpg`;
const camInput = `<input type="file" accept="image/*" capture="environment" hidden>`;
function thumbs(names, dataMap, removable = true) {
  return names.map((n, i) => `<div class="thumb"><img src="${dataMap[n] || ""}" data-zoom alt="">${removable ? `<button type="button" data-rm="${i}">✕</button>` : ""}</div>`).join("");
}
/** Bouton photo : ajoute au tableau `target.photos` (noms) et à `dataMap` (nom → dataURL). */
function bindPhotos(box, target, dataMap, onChange) {
  const input = box.querySelector("input[type=file]");
  box.querySelector("[data-cam]").onclick = () => input.click();
  input.onchange = async () => {
    for (const file of input.files) {
      try { const data = await compressImage(file); const n = photoName(); dataMap[n] = data; (target.photos ||= []).push(n); }
      catch (e) { toast(e.message, true); }
    }
    input.value = ""; onChange();
  };
  box.querySelector(".thumbs").onclick = (e) => {
    const b = e.target.closest("[data-rm]"); if (!b) return;
    const [n] = target.photos.splice(Number(b.dataset.rm), 1); delete dataMap[n]; onChange();
  };
}

/* ---------------- écrans ---------------- */
const main = () => $("#main");
async function route() {
  const s = await settings();
  const hash = location.hash.replace(/^#\/?/, "");
  const [path, query] = hash.split("?");
  const parts = path.split("/").map(decodeURIComponent);
  const params = Object.fromEntries(new URLSearchParams(query || ""));
  $$("[data-nav]").forEach((a) => a.classList.toggle("active", a.dataset.nav === (parts[0] || "home")));
  $("#nav").classList.toggle("hidden", parts[0] === "controle");
  $("#who").classList.toggle("hidden", !s.controller);
  $("#who").textContent = s.controller ? `👤 ${s.controller}` : "";
  window.scrollTo(0, 0);
  $("#topTitle").textContent = "Contrôle qualité";
  if (parts[0] !== "reglages" && (!s.url || !s.controller)) return pageSetup(s);
  const pages = { "": pageHome, controle: () => pageControl(parts[1], parts[2], params), rapport: () => pageReport(parts[1]), objet: () => pageLost(params), historique: pageHistory, reglages: pageSettings };
  try { await (pages[parts[0]] || pageHome)(); } catch (e) { main().innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
}

      <div class="floors" style="margin-top:8px">${Object.keys(floors).sort((a, b) => b - a).map((f) => `<div class="floor"><b>Étage ${f}</b><div class="tiles">${floors[f].map((s) => { const l = last[`studio|${s.studio}`]; return `<a class="tile ${l ? esc(l.result) : ""} ${mineToday.has(s.studio) ? "today" : ""} ${vip.has(s.studio) ? "vip" : ""}" href="#/controle/studio/${s.studio}${vip.has(s.studio) ? "?flags=VIP" : ""}">${s.studio}<small>${l && l.score !== undefined && l.score !== "" ? fmt(l.score, 0) : s.type}</small></a>`; }).join("")}</div></div>`).join("")}</div>
      <div class="legend"><span><i style="background:#d7ecdf"></i>Validé</span><span><i style="background:#f6e6bd"></i>Réserves</span><span><i style="background:#f3cdc9"></i>Refusé</span><span><i style="background:#ece8e1"></i>Pas de contrôle</span>${vip.size ? "<span>★ VIP du jour</span>" : ""}</div></div>
    <div class="card"><div class="card-head"><h2>Parties communes</h2></div><div class="list">${areas().map((a) => { const l = last[`commun|${a.id}`]; return `<a class="row" href="#/controle/commun/${encodeURIComponent(a.id)}"><span><b>${esc(a.label)}</b><br><span class="small muted">${l ? `${fdate(l.date)} · ${fmt(l.score)}` : "Jamais contrôlé"}</span></span>${l ? resultPill(l.result) : ""}</a>`; }).join("")}</div></div>`;

async function pageControl(kind, loc, params) {
  const zones = gridFor(kind, loc);
  const studio = kind === "studio" ? CONF.studios.find((s) => s.studio === loc) : null;
  const area = kind === "commun" ? areas().find((a) => a.id === loc) : null;
  if (!zones || (!studio && !area)) throw new Error("Lieu inconnu.");
  const s = await settings();
  const title = studio ? `Studio ${studio.studio}` : area.label;
  $("#topTitle").textContent = title;
  const key = `${kind}|${loc}`;
  const fresh = () => ({ k: key, date: todayISO(), time: nowTime(), cleanType: params.parent ? "Reclean" : kind === "studio" ? "Départ" : "",
    cleaner: "", flags: params.flags ? params.flags.split(",") : [], items: {}, comment: "", techComment: "", photos: [], data: {}, parentId: params.parent || "" });
  let draft = await Store.get("drafts", key);
  const resumed = !!draft && Object.keys(draft.items || {}).length > 0;
  if (!draft || (params.parent && draft.parentId !== params.parent)) draft = fresh();
  draft.cleaner ||= await kv("lastCleaner", "");
  let saveTimer;
  const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => Store.put("drafts", draft).catch((e) => toast("Brouillon non enregistré : " + e.message, true)), 250); };
  const closed = new Set();

  const itemHtml = (zone, it) => {
    const k = `${zone.zone}|${it.id}`, e = draft.items[k] || {};
    const open = e.rating === "nc" || e.rating === "partiel" || e.comment || (e.photos || []).length;
    return `<div class="check" data-key="${esc(k)}"><div class="check-label">${esc(it.label)} ${it.critical ? '<span class="tag crit">Critique</span>' : ""}${it.tech ? '<span class="tag tech">Technique</span>' : ""}</div>
      <div class="rate">${[["ok", "✓"], ["partiel", "~"], ["nc", "✗"], ["na", "N/A"]].map(([r, l]) => `<button type="button" class="${r} ${e.rating === r ? "on" : ""}" data-r="${r}" aria-label="${RATING_LABEL[r]}">${l}</button>`).join("")}<button type="button" data-cam aria-label="Photo">📷</button></div>${camInput}
      <div class="extra ${open ? "" : "hidden"}"><input type="text" class="cmt" placeholder="Précision (ex. cheveux sous le lit)" value="${esc(e.comment || "")}"><div class="thumbs">${thumbs(e.photos || [], draft.data)}</div></div></div>`;
  };
  const zoneHtml = (zone) => {
    const done = zone.items.filter((i) => draft.items[`${zone.zone}|${i.id}`]?.rating).length;
    const zs = computeScore([zone], draft.items).zoneScores[zone.zone];
    return `<section class="zone ${closed.has(zone.zone) ? "closed" : ""}" data-zone="${esc(zone.zone)}"><div class="zone-head"><h3>${esc(zone.zone)}</h3><span class="small muted">${done}/${zone.items.length}</span><span class="zs" style="color:${scoreColor(zs)}">${zs === null ? "" : fmt(zs)}</span><button type="button" class="btn small" data-allok>Tout ✓</button></div><div class="zone-body">${zone.items.map((it) => itemHtml(zone, it)).join("")}</div></section>`;
  };
  const updateScore = () => {
    const sc = computeScore(zones, draft.items);
    $("#liveScore").textContent = sc.score === null ? "–" : fmt(sc.score);
    $("#liveScore").style.color = sc.score === null ? "#fff" : { "Validé": "#8fe0ad", "Réserves": "#ffd27a", "Refusé": "#ff9b92" }[sc.result];
    $("#liveMeta").innerHTML = `${sc.result ? `<b>${sc.result}</b> · ` : ""}${sc.rated}/${sc.total} points${sc.critical.length ? ` · <b style="color:#ff9b92">${sc.critical.length} critique(s)</b>` : ""}`;
    for (const z of zones) {
      const node = $(`.zone[data-zone="${CSS.escape(z.zone)}"]`);
      node.querySelector(".zone-head .muted").textContent = `${z.items.filter((i) => draft.items[`${z.zone}|${i.id}`]?.rating).length}/${z.items.length}`;
      const zs = sc.zoneScores[z.zone], zn = node.querySelector(".zs"); zn.textContent = zs === null ? "" : fmt(zs); zn.style.color = scoreColor(zs);
    }
  };
  const bindCheck = (node) => {
    const k = node.dataset.key;
    const entry = () => (draft.items[k] ||= { rating: "", comment: "", photos: [] });
    const rerender = () => { const [zn, id] = k.split("|"); const z = zones.find((x) => x.zone === zn); node.outerHTML = itemHtml(z, z.items.find((i) => i.id === id)); bindCheck($(`.check[data-key="${CSS.escape(k)}"]`)); };
    node.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => {
      const e = entry(); e.rating = e.rating === b.dataset.r ? "" : b.dataset.r; save(); rerender(); updateScore();
    }));
    node.querySelector(".cmt").oninput = (ev) => { entry().comment = ev.target.value; save(); };
    bindPhotos(node, entry(), draft.data, () => { save(); rerender(); });
  };
  const bindZone = (zn) => {
    const name = zn.dataset.zone;
    zn.querySelector(".zone-head").onclick = (e) => { if (e.target.closest("[data-allok]")) return; zn.classList.toggle("closed"); zn.classList.contains("closed") ? closed.add(name) : closed.delete(name); };
    zn.querySelector("[data-allok]").onclick = () => {
      const z = zones.find((x) => x.zone === name);
      for (const it of z.items) { const e = (draft.items[`${z.zone}|${it.id}`] ||= { rating: "", comment: "", photos: [] }); if (!e.rating) e.rating = "ok"; }
      save(); zn.outerHTML = zoneHtml(z); const n = $(`.zone[data-zone="${CSS.escape(name)}"]`); $$(".check", n).forEach(bindCheck); bindZone(n); updateScore();
    };
  };

  main().innerHTML = `${resumed ? `<div class="banner info"><span>Contrôle en cours repris.</span><button class="btn small danger" id="reset">Recommencer</button></div>` : ""}
    ${params.parent ? `<div class="banner warn">Recontrôle après reclean.</div>` : ""}
    <div class="card"><p class="small muted" style="margin:0 0 8px">${studio ? `${esc(studio.type)} · étage ${studio.floor}` : "Partie commune"} · contrôleur : <b>${esc(s.controller)}</b></p>
      <div class="grid2"><label class="f">Date<input type="date" id="fDate" value="${esc(draft.date)}"></label><label class="f">Heure<input type="time" id="fTime" value="${esc(draft.time)}"></label></div>
      <label class="f">Type de nettoyage<select id="fClean"><option value="">—</option>${CONF.cleanTypes.map((t) => `<option ${draft.cleanType === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
      <label class="f">Agent / prestataire<input type="text" id="fCleaner" list="cl" value="${esc(draft.cleaner)}" placeholder="ex. HCS – prénom"><datalist id="cl">${["HCS", ...(CONF.cleaners || [])].map((c) => `<option value="${esc(c)}">`).join("")}</datalist></label>
      <div class="chips" id="fFlags">${CONF.flags.map((f) => `<button type="button" class="chip ${draft.flags.includes(f) ? "on" : ""}" data-flag="${esc(f)}">${esc(f)}</button>`).join("")}</div></div>
    <div id="zones">${zones.map(zoneHtml).join("")}</div>
    <div class="card"><label class="f">Commentaire général<textarea id="fComment">${esc(draft.comment)}</textarea></label>
      <label class="f">Signalement technique (maintenance)<textarea id="fTech">${esc(draft.techComment)}</textarea></label>
      <div id="gen"><button type="button" class="btn" data-cam>📷 Photos générales</button>${camInput}<div class="thumbs" style="margin-top:8px">${thumbs(draft.photos, draft.data)}</div></div></div>
    <div class="btns" style="margin-bottom:80px"><a class="btn" href="#/">← Quitter (brouillon gardé)</a></div>
    <div class="scorebar"><span class="big" id="liveScore">–</span><span class="meta" id="liveMeta"></span><button class="btn primary" id="saveCtrl">Enregistrer</button></div>`;
  $$(".check").forEach(bindCheck); $$(".zone").forEach(bindZone);
  const field = (id, prop, ev = "input") => ($(id)[`on${ev}`] = (e) => { draft[prop] = e.target.value; save(); });
  field("#fDate", "date"); field("#fTime", "time"); field("#fClean", "cleanType", "change"); field("#fCleaner", "cleaner"); field("#fComment", "comment"); field("#fTech", "techComment");
  $("#fFlags").onclick = (e) => { const c = e.target.closest("[data-flag]"); if (!c) return; const f = c.dataset.flag; draft.flags = draft.flags.includes(f) ? draft.flags.filter((x) => x !== f) : [...draft.flags, f]; c.classList.toggle("on"); save(); };
  const gen = $("#gen"); bindPhotos(gen, draft, draft.data, () => { save(); gen.querySelector(".thumbs").innerHTML = thumbs(draft.photos, draft.data); });
  $("#reset")?.addEventListener("click", async () => { if (confirm("Effacer ce contrôle en cours ?")) { await Store.del("drafts", key); route(); } });
  updateScore();

  $("#saveCtrl").onclick = async () => {
    const sc = computeScore(zones, draft.items);
    if (!sc.rated) return toast("Évaluez au moins un point.", true);
    if (sc.total - sc.rated && !confirm(`${sc.total - sc.rated} point(s) non évalué(s), ignorés dans le score. Enregistrer quand même ?`)) return;
    const naked = Object.values(draft.items).filter((e) => e.rating === "nc" && !e.comment && !(e.photos || []).length).length;
    if (naked && !confirm(`${naked} non-conformité(s) sans précision ni photo. Enregistrer quand même ?`)) return;
    const id = `C${draft.date.replace(/-/g, "")}-${stamp().slice(9)}-${hex(2)}`;
    const items = [];
    for (const z of zones) for (const it of z.items) {
      const e = draft.items[`${z.zone}|${it.id}`];
      if (e && (e.rating || e.comment || (e.photos || []).length)) items.push({ id: `${z.zone}|${it.id}`, zone: z.zone, label: it.label, rating: e.rating || "", comment: e.comment || "", photos: e.photos || [] });
    }
    const used = new Set([...draft.photos, ...items.flatMap((i) => i.photos)]);
    const photos = [...used].filter((n) => draft.data[n]).map((n) => ({ name: n, data: draft.data[n].split(",")[1] }));
    const record = { id, kind, location: loc, label: title, roomType: studio ? studio.type : area.type, floor: studio ? studio.floor : area.floor,
      date: draft.date, time: draft.time, cleanType: draft.cleanType, cleaner: draft.cleaner.trim(), flags: draft.flags, controllerName: s.controller,
      comment: draft.comment, techComment: draft.techComment, parentId: draft.parentId, photos: draft.photos.filter((n) => draft.data[n]), items,
      score: sc.score, result: sc.result, critical: sc.critical, zoneScores: sc.zoneScores, createdAt: new Date().toISOString(), device: "gsm", appVersion: VERSION };
    try {
      await enqueue("inspection", record, photos, { kind, location: loc, label: title, date: draft.date, time: draft.time, score: sc.score, result: sc.result,
        defects: items.filter((i) => i.rating === "nc" || i.rating === "partiel").map((i) => ({ zone: i.zone, label: i.label, rating: i.rating, comment: i.comment })) });
      await Store.del("drafts", key);
      if (draft.cleaner) await setKv("lastCleaner", draft.cleaner.trim());
      toast(`Enregistré : ${fmt(sc.score)} – ${sc.result}`);
      location.hash = `#/rapport/${id}`;
    } catch (e) { toast("Enregistrement impossible : " + e.message, true); }
  };
}

  $$("[data-del]").forEach((b) => (b.onclick = async () => { s.controllers = s.controllers.filter((n) => n !== b.dataset.del); if (s.controller === b.dataset.del) s.controller = ""; await saveSettings(s); route(); }));

  };
  $("#test").onclick = async () => {
    try { const r = await relayPost({ kind: "ping" }); toast(`Connexion OK (${r.account || "relais"}).`); await refreshState(); }
    catch (e) { toast("Échec : " + e.message, true); }
  };
  $("#retry2")?.addEventListener("click", () => flush().then(route));
}

/* ---------------- démarrage ---------------- */
(async function start() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  try {
    const s = await settings();
    if (s.persisted === null && navigator.storage && navigator.storage.persist) { s.persisted = await navigator.storage.persist(); await saveSettings(s); }
  } catch { /* facultatif */ }
  await loadConf();
  await route();
  flush();
  refreshState().then((ok) => { if (ok && (location.hash === "" || location.hash === "#/")) route(); });
  setInterval(flush, 60000);
})();
</script>
